<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1040 560" font-family="'Inter','Segoe UI',sans-serif" role="img" aria-label="Swaraj Hansa data pipeline: Wazuh collectors over mTLS into Logstash and Kafka, a normaliser, deterministic risk scoring that gates a local LLM triage layer, then PostgreSQL and OpenSearch stores feeding a FastAPI and React analyst console.">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#060d1a"/>
      <stop offset="1" stop-color="#0a1626"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#00d4ff"/>
      <stop offset="1" stop-color="#a855f7"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#3b5068"/>
    </marker>
    <style>
      .box{fill:rgba(12,26,42,.9);stroke:rgba(0,212,255,.28);stroke-width:1.5;rx:12;}
      .ai{stroke:rgba(168,85,247,.5);}
      .store{stroke:rgba(34,211,167,.4);}
      .t{fill:#e8eef6;font-size:16px;font-weight:600;}
      .s{fill:#8aa0b6;font-size:12px;}
      .tag{fill:#00d4ff;font-size:11px;font-weight:600;letter-spacing:.5px;}
      .flow{stroke:#3b5068;stroke-width:1.6;fill:none;}
    </style>
  </defs>

  <rect width="1040" height="560" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1038" height="558" rx="18" fill="none" stroke="rgba(0,212,255,.15)"/>

  <text x="40" y="48" class="t" font-size="22">Swaraj Hansa — agentic multi-tenant SIEM</text>
  <text x="40" y="72" class="s">Collection → streaming → normalisation → risk-gated AI triage → dual store → analyst console</text>

  <!-- Row 1: collection to normalise -->
  <g>
    <rect class="box" x="40" y="110" width="150" height="74" rx="12"/>
    <text x="115" y="140" text-anchor="middle" class="t">Wazuh agents</text>
    <text x="115" y="162" text-anchor="middle" class="s">endpoint + log collectors</text>

    <rect class="box" x="250" y="110" width="150" height="74" rx="12"/>
    <text x="325" y="140" text-anchor="middle" class="t">Logstash</text>
    <text x="325" y="162" text-anchor="middle" class="s">central ingest</text>

    <rect class="box" x="460" y="110" width="150" height="74" rx="12"/>
    <text x="535" y="140" text-anchor="middle" class="t">Kafka</text>
    <text x="535" y="162" text-anchor="middle" class="s">durable stream buffer</text>

    <rect class="box" x="670" y="110" width="150" height="74" rx="12"/>
    <text x="745" y="140" text-anchor="middle" class="t">Normaliser</text>
    <text x="745" y="162" text-anchor="middle" class="s">schema + enrichment</text>

    <path class="flow" d="M190 147H250" marker-end="url(#arrow)"/>
    <path class="flow" d="M400 147H460" marker-end="url(#arrow)"/>
    <path class="flow" d="M610 147H670" marker-end="url(#arrow)"/>

    <!-- mTLS tag on first hop -->
    <rect x="193" y="88" width="54" height="20" rx="10" fill="rgba(0,212,255,.12)"/>
    <text x="220" y="102" text-anchor="middle" class="tag">mTLS</text>
  </g>

  <!-- Row 2: risk gate + AI -->
  <g>
    <rect class="box" x="670" y="240" width="150" height="88" rx="12"/>
    <text x="745" y="272" text-anchor="middle" class="t">Risk scoring</text>
    <text x="745" y="292" text-anchor="middle" class="s">severity · threat intel</text>
    <text x="745" y="308" text-anchor="middle" class="s">MITRE ATT&amp;CK weight</text>

    <rect class="box ai" x="440" y="240" width="170" height="88" rx="12"/>
    <text x="525" y="268" text-anchor="middle" class="t">LLM triage</text>
    <text x="525" y="288" text-anchor="middle" class="s">local via Ollama</text>
    <text x="525" y="304" text-anchor="middle" class="s">fail-safe → NEEDS_REVIEW</text>

    <!-- vertical from normaliser down to risk scoring -->
    <path class="flow" d="M745 184V240" marker-end="url(#arrow)"/>
    <!-- gate arrow risk -> LLM, only high risk -->
    <path class="flow" d="M670 284H610" marker-end="url(#arrow)"/>
    <rect x="612" y="246" width="78" height="20" rx="10" fill="rgba(168,85,247,.14)"/>
    <text x="651" y="260" text-anchor="middle" class="tag" fill="#c084fc">high-risk only</text>
  </g>

  <!-- Row 3: stores + console -->
  <g>
    <rect class="box store" x="250" y="390" width="170" height="78" rx="12"/>
    <text x="335" y="420" text-anchor="middle" class="t">PostgreSQL 16</text>
    <text x="335" y="442" text-anchor="middle" class="s">incidents · RLS · verdicts</text>

    <rect class="box store" x="460" y="390" width="170" height="78" rx="12"/>
    <text x="545" y="420" text-anchor="middle" class="t">OpenSearch</text>
    <text x="545" y="442" text-anchor="middle" class="s">per-tenant indices</text>

    <rect class="box" x="700" y="390" width="180" height="78" rx="12"/>
    <text x="790" y="420" text-anchor="middle" class="t">FastAPI + React</text>
    <text x="790" y="442" text-anchor="middle" class="s">analyst console + MCP chat</text>

    <!-- LLM triage -> stores -->
    <path class="flow" d="M500 328V360H335V390" marker-end="url(#arrow)"/>
    <path class="flow" d="M545 328V390" marker-end="url(#arrow)"/>
    <!-- stores -> console -->
    <path class="flow" d="M630 429H700" marker-end="url(#arrow)"/>
  </g>

  <!-- Tenant isolation footer band -->
  <rect x="40" y="498" width="960" height="40" rx="10" fill="rgba(0,212,255,.06)" stroke="rgba(0,212,255,.18)"/>
  <text x="60" y="523" class="tag">TENANT ISOLATION</text>
  <text x="210" y="523" class="s">mTLS certificate identity · per-tenant OpenSearch indices · PostgreSQL row-level security · app-level scoping with dual-logged cross-tenant actions</text>

  <text x="1000" y="86" text-anchor="end" class="s">7/7 attack scenarios routed correctly · 105 raw alerts → ~18 incidents</text>
</svg>
